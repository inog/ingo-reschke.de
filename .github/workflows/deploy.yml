name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch: # Erlaubt manuelles Auslösen in GitHub Actions

concurrency:
  group: deploy-netcup
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy to Netcup Webhosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose FTP Server Directory
        continue-on-error: true
        run: |
          python3 - << 'EOF' >> $GITHUB_STEP_SUMMARY
          import os, ftplib, ssl
          server = os.environ.get("FTP_SERVER", "")
          user = os.environ.get("FTP_USERNAME", "")
          password = os.environ.get("FTP_PASSWORD", "")
          print("### 🔍 FTP Server Verzeichnisstruktur\n")
          try:
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
              ftp = ftplib.FTP_TLS(context=ctx)
              ftp.connect(server, 21, timeout=15)
              ftp.login(user, password)
              ftp.prot_p()
              pwd = ftp.pwd()
              print(f"- **Startverzeichnis (pwd)**: `{pwd}`\n")
              print("```text")
              ftp.dir()
              print("```")
              ftp.quit()
          except Exception as e:
              print(f"**Fehler beim FTP-Check**: `{e}`")
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: httpdocs/website/
          protocol: ftps
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.idea/**
            **/README.md
            **/.gitignore
